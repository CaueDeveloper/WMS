<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>{% block title %}WMS Café do Sítio{% endblock %}</title>
    <style>
        :root {
            --cor-fundo: #ffffff;
            --cor-texto: #111111;
            --cor-primaria: #0b3d0b;
            --cor-primaria-hover: #0f5c0f;
            --cor-erro: #b00020;
            --cor-ok: #0b3d0b;
            --cor-borda: #111111;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--cor-fundo);
            color: var(--cor-texto);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20px;
            line-height: 1.4;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 24px 16px;
        }
        h1 { font-size: 26px; margin: 0 0 24px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; }
        input[type="text"], input[type="password"], input[type="number"], select {
            width: 100%;
            padding: 14px;
            font-size: 22px;
            border: 2px solid var(--cor-borda);
            margin-bottom: 16px;
            background: #fff;
            color: var(--cor-texto);
        }
        button, .btn {
            display: inline-block;
            width: 100%;
            padding: 16px;
            font-size: 22px;
            font-weight: bold;
            background: var(--cor-primaria);
            color: #fff;
            border: none;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }
        button:hover, .btn:hover { background: var(--cor-primaria-hover); }
        button.btn-rejeitar {
            background: #fff;
            color: var(--cor-erro);
            border: 2px solid var(--cor-erro);
        }
        .cartao {
            border: 2px solid var(--cor-borda);
            padding: 12px;
            margin-bottom: 16px;
        }
        .erro {
            color: var(--cor-erro);
            font-weight: bold;
            border: 2px solid var(--cor-erro);
            padding: 10px;
            margin-bottom: 16px;
        }
        .ok {
            color: var(--cor-ok);
            font-weight: bold;
            border: 2px solid var(--cor-ok);
            padding: 10px;
            margin-bottom: 16px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--cor-primaria);
            color: #fff;
        }
        .topbar a, .topbar button {
            color: #fff;
            width: auto;
            padding: 8px 14px;
            font-size: 16px;
            background: transparent;
            border: 1px solid #fff;
        }

        /* Dashboards mais amplos (visão geral do estoque) — não usados no coletor */
        .container-amplo {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 16px;
            font-size: 15px;
        }
        .container-amplo h1 { font-size: 22px; }
        .container-amplo a.btn { width: auto; display: inline-block; padding: 8px 14px; font-size: 14px; }
        .resumo-estoque {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin: 16px 0 24px;
        }
        .resumo-estoque .stat {
            border: 2px solid var(--cor-borda);
            padding: 10px 16px;
            flex: 1;
            min-width: 160px;
        }
        .resumo-estoque .stat .rotulo { font-size: 13px; text-transform: uppercase; }
        .resumo-estoque .stat .valor { font-size: 26px; font-weight: bold; }
        .scroll-x { overflow-x: auto; margin-bottom: 32px; }
        table.mapa-estoque, table.tabela-guardas {
            width: 100%;
            border-collapse: collapse;
        }
        table.mapa-estoque th, table.mapa-estoque td,
        table.tabela-guardas th, table.tabela-guardas td {
            border: 1px solid var(--cor-borda);
            padding: 6px 8px;
            text-align: center;
            font-size: 13px;
            white-space: nowrap;
        }
        table.tabela-guardas th {
            background: var(--cor-primaria);
            color: #fff;
        }
        table.tabela-guardas td { text-align: left; }
        td.cel-endereco { font-weight: bold; line-height: 1.3; }
        td.cel-endereco small { font-weight: normal; display: block; }
        .nivel-vazio { background: #f5f5f5; color: #888; }
        .nivel-baixo { background: #d7f0d7; }
        .nivel-medio { background: #fff3c4; }
        .nivel-alto { background: #ffd8a8; }
        .nivel-cheio { background: #f3b3b3; }
        .legenda { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; font-size: 13px; }
        .legenda span { display: inline-flex; align-items: center; gap: 6px; }
        .legenda .amostra { width: 16px; height: 16px; border: 1px solid var(--cor-borda); display: inline-block; }
        .grade-lados { display: flex; gap: 24px; flex-wrap: wrap; }
        .lado-bloco { flex: 1; min-width: 260px; }
        .btn-endereco {
            width: 100%;
            background: inherit;
            color: inherit;
            border: 1px solid var(--cor-borda);
            padding: 4px 2px;
            font-size: 13px;
            font-weight: bold;
            line-height: 1.3;
            cursor: pointer;
        }
        .btn-endereco small { font-weight: normal; display: block; }
        .btn-endereco:hover { background: inherit; opacity: 0.8; }
        td.cel-endereco.indisponivel { opacity: 0.55; cursor: not-allowed; }

        .paginacao { display: flex; gap: 12px; margin: 16px 0; }
        .paginacao a.btn, .paginacao span.btn-disabled { flex: 1; text-align: center; }
        .paginacao span.btn-disabled { opacity: 0.4; background: var(--cor-borda); color: #fff; }
        .paginacao .pagina-atual { align-self: center; font-size: 14px; white-space: nowrap; }
        .container-amplo .paginacao a.btn { padding: 8px 14px; font-size: 14px; }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
