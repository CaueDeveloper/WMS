<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>{% block title %}WMS Café do Sítio{% endblock %}</title>
    <style>
        :root {
            --cor-fundo: #f7f6f3;
            --cor-superficie: #ffffff;
            --cor-texto: #21262b;
            --cor-texto-secundario: #5c6570;
            --cor-primaria: #1d4e45;
            --cor-primaria-hover: #256359;
            --cor-erro: #ad3b2c;
            --cor-erro-fundo: #fbeae7;
            --cor-ok: #2f7a4f;
            --cor-ok-fundo: #e9f4ed;
            --cor-alerta: #a86a10;
            --cor-alerta-fundo: #fdf1de;
            --cor-borda: #d9d4c9;
            --raio: 6px;

            /* Escala de fontes do modo coletor (.container) — telas do Zebra
               MC2700, otimizadas pra toque, texto grande e alto contraste. */
            --fs-coletor-base: 20px;
            --fs-coletor-topbar: 16px;
            --fs-coletor-h1: 26px;
            --fs-coletor-campo: 22px;
            --fs-coletor-btn: 22px;

            /* Escala de fontes do modo dashboard (.container-amplo) — telas
               de visão geral em desktop/tablet, mais densas. */
            --fs-amplo-base: 15px;
            --fs-amplo-h1: 22px;
            --fs-amplo-h2: 22px;
            --fs-amplo-h3: 18px;
            --fs-amplo-btn: 14px;
            --fs-amplo-btn-grande: 22px;
            --fs-amplo-valor: 26px;
            --fs-amplo-rotulo: 13px;
            --fs-amplo-tabela: 13px;
            --fs-amplo-pequeno: 12px;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--cor-fundo);
            color: var(--cor-texto);
            font-family: Arial, Helvetica, sans-serif;
            font-size: var(--fs-coletor-base);
            line-height: 1.4;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 24px 16px;
        }
        h1 { font-size: var(--fs-coletor-h1); margin: 0 0 24px; }
        h2 { color: var(--cor-primaria); }
        label { display: block; font-weight: bold; margin-bottom: 6px; }
        input[type="text"], input[type="password"], input[type="number"], input[type="date"], select {
            width: 100%;
            padding: 14px;
            font-size: var(--fs-coletor-campo);
            border: 2px solid var(--cor-borda);
            border-radius: var(--raio);
            margin-bottom: 16px;
            background: var(--cor-superficie);
            color: var(--cor-texto);
        }
        input[type="text"]:focus, input[type="password"]:focus, input[type="number"]:focus, input[type="date"]:focus, select:focus {
            outline: none;
            border-color: var(--cor-primaria);
        }
        button, .btn {
            display: inline-block;
            width: 100%;
            padding: 16px;
            font-size: var(--fs-coletor-btn);
            font-weight: bold;
            background: var(--cor-primaria);
            color: #fff;
            border: none;
            border-radius: var(--raio);
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background-color 0.15s ease;
        }
        button:hover, .btn:hover { background: var(--cor-primaria-hover); }
        button:disabled {
            background: var(--cor-borda);
            color: var(--cor-texto-secundario);
            cursor: not-allowed;
        }
        button:disabled:hover { background: var(--cor-borda); }
        button.btn-rejeitar {
            background: var(--cor-superficie);
            color: var(--cor-erro);
            border: 2px solid var(--cor-erro);
        }
        .cartao {
            background: var(--cor-superficie);
            border: 1px solid var(--cor-borda);
            border-left: 4px solid var(--cor-primaria);
            border-radius: var(--raio);
            padding: 12px 14px;
            margin-bottom: 16px;
        }
        .painel-relatorio {
            margin-bottom: 16px;
        }
        .painel-relatorio summary {
            list-style: none;
        }
        .painel-relatorio summary::-webkit-details-marker {
            display: none;
        }
        .painel-relatorio[open] summary {
            margin-bottom: 12px;
        }
        .painel-relatorio form[method="get"] {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            margin-bottom: 12px;
        }
        .painel-relatorio form[method="get"] label {
            margin-bottom: 6px;
        }
        .painel-relatorio form[method="get"] input[type="date"] {
            margin-bottom: 0;
            width: auto;
        }
        .painel-relatorio form[method="get"] button {
            width: auto;
            padding: 14px 20px;
        }
        .cartao-cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: wrap;
        }
        .cartao details {
            background: var(--cor-fundo);
            border: 1px solid var(--cor-borda);
            border-radius: var(--raio);
            padding: 8px 12px;
            margin-top: 10px;
        }
        .cartao details summary {
            cursor: pointer;
            font-weight: bold;
        }
        .cartao details ul {
            list-style: none;
            margin: 8px 0 0;
            padding-left: 0;
        }
        .cartao details li {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        .selo-status {
            display: inline-block;
            flex-shrink: 0;
            font-size: var(--fs-amplo-pequeno);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            border-radius: 999px;
            padding: 2px 10px;
        }
        .selo-status.selo-concluido {
            color: var(--cor-ok);
            background: var(--cor-ok-fundo);
            border: 1px solid var(--cor-ok);
        }
        .selo-status.selo-pendente {
            color: var(--cor-erro);
            background: var(--cor-erro-fundo);
            border: 1px solid var(--cor-erro);
        }
        .amostra.cor-erro { background: var(--cor-erro-fundo); border-color: var(--cor-erro); }
        .amostra.cor-alerta { background: var(--cor-alerta-fundo); border-color: var(--cor-alerta); }
        .amostra.cor-ok { background: var(--cor-ok-fundo); border-color: var(--cor-ok); }
        .erro {
            color: var(--cor-erro);
            background: var(--cor-erro-fundo);
            font-weight: bold;
            border: 1px solid var(--cor-erro);
            border-radius: var(--raio);
            padding: 10px 12px;
            margin-bottom: 16px;
        }
        .ok {
            color: var(--cor-ok);
            background: var(--cor-ok-fundo);
            font-weight: bold;
            border: 1px solid var(--cor-ok);
            border-radius: var(--raio);
            padding: 10px 12px;
            margin-bottom: 16px;
        }
        .contador-bipagem {
            display: inline-block;
            font-weight: bold;
            font-size: var(--fs-amplo-btn-grande);
            border-radius: 999px;
            padding: 6px 18px;
            margin: 0;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .contador-bipagem.contador-zerado {
            color: var(--cor-erro);
            background: var(--cor-erro-fundo);
            border: 1px solid var(--cor-erro);
        }
        .contador-bipagem.contador-parcial {
            color: var(--cor-alerta);
            background: var(--cor-alerta-fundo);
            border: 1px solid var(--cor-alerta);
        }
        .contador-bipagem.contador-completo {
            color: var(--cor-ok);
            background: var(--cor-ok-fundo);
            border: 1px solid var(--cor-ok);
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--cor-primaria);
            color: #fff;
        }
        .topbar a, .topbar button {
            color: #fff;
            width: auto;
            padding: 8px 14px;
            font-size: var(--fs-coletor-topbar);
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: var(--raio);
        }
        .topbar a:hover, .topbar button:hover { background: rgba(255, 255, 255, 0.12); }

        /* Dashboards mais amplos (visão geral do estoque) — não usados no coletor */
        .container-amplo {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 16px;
            font-size: var(--fs-amplo-base);
        }
        .container-amplo h1 { font-size: var(--fs-amplo-h1); }
        .container-amplo a.btn { width: auto; display: inline-block; padding: 8px 14px; font-size: var(--fs-amplo-btn); }
        .container-amplo a.btn.btn-grande { display: block; width: 100%; padding: 16px; font-size: var(--fs-amplo-btn-grande); }
        .resumo-estoque {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin: 16px 0 24px;
        }
        .resumo-estoque .stat {
            background: var(--cor-superficie);
            border: 1px solid var(--cor-borda);
            border-top: 3px solid var(--cor-primaria);
            border-radius: var(--raio);
            padding: 10px 16px;
            flex: 1;
            min-width: 160px;
        }
        .resumo-estoque .stat .rotulo { font-size: var(--fs-amplo-rotulo); text-transform: uppercase; color: var(--cor-texto-secundario); letter-spacing: 0.03em; }
        .resumo-estoque .stat .valor { font-size: var(--fs-amplo-valor); font-weight: bold; color: var(--cor-primaria); }
        .scroll-x { overflow-x: auto; margin-bottom: 32px; }
        table.mapa-estoque, table.tabela-guardas {
            width: 100%;
            border-collapse: collapse;
            background: var(--cor-superficie);
        }
        table.mapa-estoque th, table.mapa-estoque td,
        table.tabela-guardas th, table.tabela-guardas td {
            border: 1px solid var(--cor-borda);
            padding: 6px 8px;
            text-align: center;
            font-size: var(--fs-amplo-tabela);
            white-space: nowrap;
        }
        table.mapa-estoque th {
            background: var(--cor-primaria);
            color: #fff;
            font-weight: bold;
            font-size: calc(var(--fs-amplo-tabela) + 2px);
        }
        table.mapa-estoque thead th { position: sticky; top: 0; z-index: 1; }
        table.mapa-estoque tbody th { position: sticky; left: 0; z-index: 1; }
        table.tabela-guardas th {
            background: var(--cor-primaria);
            color: #fff;
        }
        table.tabela-guardas td { text-align: left; }
        td.cel-endereco { font-weight: bold; line-height: 1.3; }
        td.cel-endereco small { font-weight: normal; display: block; }
        .nivel-vazio { background: #eef0ec; color: var(--cor-texto-secundario); }
        .nivel-baixo { background: #d9ecd6; }
        .nivel-medio { background: #f5e3ae; }
        .nivel-alto { background: #f0c896; }
        .nivel-cheio { background: #e8b0a3; }
        .legenda { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin-top: 20px; margin-bottom: 24px; font-size: var(--fs-amplo-rotulo); color: var(--cor-texto-secundario); }
        .legenda span { display: inline-flex; align-items: center; gap: 6px; }
        .legenda .amostra { width: 16px; height: 16px; border: 1px solid var(--cor-borda); border-radius: 3px; display: inline-block; }

        .titulo-grade { color: var(--cor-primaria); font-size: var(--fs-amplo-base); margin: 0 0 8px; }
        td.cel-endereco-btn { padding: 0; }
        .btn-endereco {
            display: block;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 6px 8px;
            border: none;
            border-radius: 0;
            font-size: var(--fs-amplo-tabela);
            font-weight: bold;
            line-height: 1.3;
            text-align: center;
            white-space: nowrap;
            cursor: pointer;
            color: var(--cor-texto);
            text-decoration: none;
        }
        .btn-endereco small { font-weight: normal; display: block; }
        .btn-endereco:hover { filter: brightness(0.93); }
        .cel-endereco.indisponivel { opacity: 0.55; cursor: not-allowed; }
        table.mapa-estoque td.cel-endereco.no-caminho {
            border: 3px solid var(--cor-primaria);
            background-image: linear-gradient(0deg, rgba(29, 78, 69, .22), rgba(29, 78, 69, .22));
        }
        table.mapa-estoque td.cel-endereco.inicio-caminho {
            border: 3px solid var(--cor-primaria);
            background-image: linear-gradient(0deg, rgba(29, 78, 69, .38), rgba(29, 78, 69, .38));
            font-weight: bold;
        }
        table.mapa-estoque td.cel-endereco.destino-caminho {
            border: 3px solid var(--cor-erro);
            background-image: linear-gradient(0deg, rgba(173, 59, 44, .28), rgba(173, 59, 44, .28));
            font-weight: bold;
        }
        table.mapa-estoque td.cel-endereco small.marcador-rota { font-weight: bold; }
        table.mapa-estoque td.cel-endereco.destino-caminho small.marcador-rota { color: var(--cor-erro); }
        table.mapa-estoque td.cel-endereco.inicio-caminho small.marcador-rota { color: var(--cor-primaria); }
        table.mapa-estoque td.cel-endereco small.seta-rota { font-weight: bold; color: var(--cor-primaria); font-size: var(--fs-amplo-tabela); }
        .amostra.inicio-caminho { border: 3px solid var(--cor-primaria); background: #c7ded7; }
        .amostra.no-caminho { border: 3px solid var(--cor-primaria); background: #dcebe8; }
        .amostra.destino-caminho { border: 3px solid var(--cor-erro); background: var(--cor-erro-fundo); }

        .resumo-rota {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            background: var(--cor-superficie);
            border: 1px solid var(--cor-borda);
            border-radius: var(--raio);
            padding: 14px 18px;
            margin: 4px 0 16px;
        }
        .resumo-rota-ponto { display: flex; align-items: center; gap: 10px; }
        .resumo-rota-marcador {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: var(--fs-amplo-base); font-weight: bold; color: #fff; flex-shrink: 0;
        }
        .resumo-rota-marcador.inicio { background: var(--cor-primaria); }
        .resumo-rota-marcador.destino { background: var(--cor-erro); }
        .resumo-rota-ponto .rotulo { font-size: var(--fs-amplo-pequeno); text-transform: uppercase; color: var(--cor-texto-secundario); letter-spacing: .03em; }
        .resumo-rota-ponto .valor { font-weight: bold; color: var(--cor-texto); }
        .resumo-rota-trajeto { display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 70px; }
        .resumo-rota-trajeto .seta-grande { font-size: var(--fs-amplo-btn-grande); line-height: 1; font-weight: bold; color: var(--cor-primaria); }
        .resumo-rota-trajeto small { color: var(--cor-texto-secundario); font-size: var(--fs-amplo-pequeno); }
        .resumo-rota-texto { color: var(--cor-texto-secundario); font-size: var(--fs-amplo-rotulo); margin: 0 0 20px; }

        .paginacao { display: flex; gap: 12px; margin: 16px 0; }
        .paginacao a.btn, .paginacao span.btn-disabled { flex: 1; text-align: center; }
        .paginacao span.btn-disabled { opacity: 0.5; background: var(--cor-borda); color: var(--cor-texto-secundario); }
        .paginacao .pagina-atual { align-self: center; font-size: var(--fs-amplo-btn); white-space: nowrap; color: var(--cor-texto-secundario); }
        .container-amplo .paginacao a.btn { padding: 8px 14px; font-size: var(--fs-amplo-btn); }
        .container-amplo .paginacao a.btn.btn-grande { padding: 16px; font-size: var(--fs-amplo-btn-grande); }

        .secao-estatistica {
            background: var(--cor-superficie);
            border: 1px solid var(--cor-borda);
            border-radius: var(--raio);
            padding: 20px 24px;
            margin-bottom: 28px;
        }
        .secao-estatistica h2 { font-size: var(--fs-amplo-h2); margin-top: 0; }
        .secao-estatistica h3 { font-size: var(--fs-amplo-h3); }
        .secao-estatistica .resumo-estoque .stat .rotulo { font-size: var(--fs-amplo-rotulo); }
        .secao-estatistica .resumo-estoque .stat .valor { font-size: var(--fs-amplo-valor); }
        .secao-estatistica table.mapa-estoque th,
        .secao-estatistica table.mapa-estoque td { font-size: var(--fs-amplo-tabela); padding: 10px 12px; }
        .filtro-periodo {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .filtro-periodo label { margin: 0; font-weight: normal; font-size: var(--fs-amplo-rotulo); color: var(--cor-texto-secundario); }
        .filtro-periodo input[type="date"] { width: auto; margin-bottom: 0; padding: 10px 12px; font-size: var(--fs-amplo-base); }
        .graficos-lado-a-lado {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .graficos-lado-a-lado canvas { flex: 1; min-width: 280px; max-height: 340px; }
        .secao-estatistica canvas { max-height: 340px; margin-bottom: 20px; }
        .pagina-estatisticas .btn-aplicar-filtros { width: auto; padding: 14px 28px; font-size: var(--fs-amplo-h3); }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    {% block extra_js %}{% endblock %}
</body>
</html>
