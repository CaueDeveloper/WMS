{% extends 'base.html' %}

{% block title %}Login — WMS Café do Sítio{% endblock %}

{% block content %}
<div class="container">
    <h1>Café do Sítio · WMS</h1>
    {% if form.errors %}
        <p class="erro">Usuário ou senha inválidos.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <label for="id_username">Usuário</label>
        <input type="text" name="username" id="id_username" autofocus autocomplete="username" required>
        <label for="id_password">Senha</label>
        <input type="password" name="password" id="id_password" autocomplete="current-password" required>
        <button type="submit">Entrar</button>
        <input type="hidden" name="next" value="{{ next }}">
    </form>
</div>
{% endblock %}
